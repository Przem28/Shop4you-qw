<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site4You</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0f172a;
  color: white;
}
button {
  cursor: pointer;
}
.header {
  display: flex;
  justify-content: space-between;
  padding: 20px;
}
.user-box {
  text-align: right;
  font-size: 14px;
}
.store-view {
  min-height: 100vh;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.store-card {
  background: rgba(0,0,0,0.7);
  padding: 40px;
  border-radius: 16px;
  max-width: 600px;
  text-align: center;
}
.buy-btn {
  margin-top: 30px;
  background: linear-gradient(90deg,#2563eb,#06b6d4);
  border: none;
  padding: 14px 26px;
  border-radius: 12px;
  font-size: 18px;
  color: white;
}
.input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="header">
  <div>Site4You</div>
  <div class="user-box" id="userBox"></div>
</div>

<div id="app"></div>

<script>
const supabase = window.supabase.createClient(
  'https://djbspbwohmdkxqtxhdcx.supabase.co',
  'YOUR_PUBLIC_ANON_KEY'
);

// --- AUTH STATUS ---
supabase.auth.getUser().then(({ data }) => {
  if (data.user) {
    userBox.innerHTML = `
      Zalogowany jako:<br>
      <strong>${data.user.email}</strong><br>
      <a href="#" onclick="logout()">Wyloguj</a>
    `;
  } else {
    userBox.innerHTML = `<a href="/login">Zaloguj</a>`;
  }
});

function logout() {
  supabase.auth.signOut().then(() => location.reload());
}

// --- SUBDOMAIN STORE VIEW ---
const host = window.location.hostname;
if (host.split('.').length > 2) {
  const subdomain = host.split('.')[0];
  loadStore(subdomain);
}

async function loadStore(subdomain) {
  const { data, error } = await supabase
    .from('stores')
    .select('*')
    .eq('subdomain', subdomain)
    .single();

  if (!data) {
    document.body.innerHTML = 'Store not found';
    return;
  }

  document.body.innerHTML = `
    <div class="store-view" style="background-image:url('${data.background_image || ''}')">
      <div class="store-card">
        <h1>${data.store_title || data.name}</h1>
        <p>${data.description || ''}</p>

        ${data.payment_link ? `
          <a href="${data.payment_link}" target="_blank">
            <button class="buy-btn">Kup teraz</button>
          </a>
        ` : `<p>Brak metody płatności</p>`}

      </div>
    </div>
  `;
}
</script>

</body>
</html>
